<div class="fs-clear-container">
  <div class="fs-clear-wrapper">
    <button
        type="button"
        [tabIndex]="-1"
        [ngClass]="{ visible: visible }"
        (click)="clearClick($event)"
        mat-icon-button>
      <mat-icon>
        clear
      </mat-icon>
    </button>
  </div>
</div>
